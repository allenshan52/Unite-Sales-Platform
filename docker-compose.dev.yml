# 本地开发覆盖：挂载前端源码并启用 Next.js 热更新。
services:
  web:
    build:
      context: ./frontend
      target: dependencies
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_AMAP_JSAPI_KEY: ${AMAP_WEB_KEY}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    restart: unless-stopped

  api:
    restart: unless-stopped

  gateway:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next: