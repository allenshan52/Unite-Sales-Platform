# 本地全栈编排：PostGIS、Redis、FastAPI、Next.js 与 Nginx 使用内部网络隔离数据库和密钥。
name: unite-sales-map

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]

  api:
    build:
      context: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AMAP_REST_API_KEY: ${AMAP_REST_API_KEY}
      CORS_ORIGINS: http://localhost:${APP_PORT}
      REDIS_URL: redis://redis:6379/0
      # 所有官方公开名单共用低并发边界；根目录 .env 可在 1 至 8 间调整。
      OFFICIAL_IMPORT_MAX_PARALLEL_REQUESTS: ${OFFICIAL_IMPORT_MAX_PARALLEL_REQUESTS:-4}
      OFFICIAL_IMPORT_MAX_REQUEST_ATTEMPTS: ${OFFICIAL_IMPORT_MAX_REQUEST_ATTEMPTS:-5}
      OFFICIAL_IMPORT_REQUEST_TIMEOUT_SECONDS: ${OFFICIAL_IMPORT_REQUEST_TIMEOUT_SECONDS:-30}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_AMAP_JSAPI_KEY: ${AMAP_WEB_KEY}
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    environment:
      AMAP_SECURITY_JS_CODE: ${AMAP_SECURITY_JS_CODE}
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
